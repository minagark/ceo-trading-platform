@if (!isLoginPage()) {
<header class="app-nav" [class.app-nav--admin]="authService.isAdmin()" [class.app-nav--analyst]="authService.isAnalyst()" [class.app-nav--client]="authService.isClient()">
  <div class="app-nav__inner">
    <a class="app-brand" routerLink="/home">
      <svg class="app-brand__logo" viewBox="0 0 64 64" aria-hidden="true">
        <ellipse class="bee-wing bee-wing--left" cx="20" cy="26" rx="12" ry="9" />
        <ellipse class="bee-wing bee-wing--right" cx="44" cy="26" rx="12" ry="9" />
        <circle class="bee-head" cx="32" cy="14" r="8" />
        <path class="bee-body" d="M32 20c-10 0-16 8-16 20 0 8 7 14 16 14s16-6 16-14c0-12-6-20-16-20z" />
        <path class="bee-stripe" d="M17 34h30" />
        <path class="bee-stripe" d="M18.5 44h27" />
        <path class="bee-stripe" d="M22 52h20" />
      </svg>
      <span>Market Hive</span>
    </a>

    @if (authService.isAuthenticated()) {
      <nav class="app-nav__links" aria-label="Main navigation">
        @if (authService.isAdmin()) {
          <a class="app-nav__link" routerLink="/admin" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Admin Dashboard</a>
        } @else if (authService.isAnalyst()) {
          <a class="app-nav__link" routerLink="/analysis" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Analyst Dashboard</a>
        } @else {
          <a class="app-nav__link" routerLink="/home" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Home</a>
          <a class="app-nav__link" routerLink="/stock" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page">Search Stocks</a>
          <a class="app-nav__link" routerLink="/trades" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page">Trade</a>
          <a class="app-nav__link" routerLink="/holdings" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page">Holdings</a>
          <a class="app-nav__link" routerLink="/history" routerLinkActive="app-nav__link--active" ariaCurrentWhenActive="page">Account Activity</a>
        }
      </nav>
      <app-user-profile />
    } @else {
      <span class="app-nav__spacer"></span>
      <a class="app-nav__link app-nav__link--login" routerLink="/login">Log in</a>
    }
  </div>
</header>
}

<main>
  <router-outlet />
</main>
