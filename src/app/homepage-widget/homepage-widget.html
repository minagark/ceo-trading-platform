<div>
    <mat-card appearance="outlined">
        <mat-card-header>
            <mat-card-title>{{ data().label }}</mat-card-title>
            @if (data().route) {
                <a [href]="data().route" class="view-all">View All</a>
            } 
        </mat-card-header>
        <mat-card-content>
            @if (data().selectedAccount !== undefined) {
                <p>
                    Selected Account{{data().selectedAccount === null ? "s" : ""}}: 
                    {{ data().selectedAccount === null ? "All ": data().selectedAccount?.name }}
                </p>
            }
            <ng-container *ngComponentOutlet="data().content; inputs: data().inputs"></ng-container>
        </mat-card-content>
    </mat-card>
</div>
