
<div class="search">
    <form [formGroup]="instrumentSearchForm" (ngSubmit)="submit()">
        <mat-form-field class="search__type">
            <mat-label>Order Type</mat-label>
            <mat-select formControlName="orderType">
                @for (orderType of NON_DEPOSIT_ORDER_TYPES; track orderType.value) {
                    <mat-option [value]="orderType.value">
                        {{ orderType.label }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>
        <mat-form-field class="search__symbol">
            <mat-label>{{ searchDisplay() }}</mat-label>
            <mat-icon matIconPrefix aria-hidden="true">search</mat-icon>
            <input matInput class="num" autocomplete="off" spellcheck="false" formControlName="symbol"/>
        </mat-form-field>
        <button matButton="filled" class="search-submit" type="submit">
            Search
        </button>
    </form>
</div>
