<div class="performance-widget" [class.performance-widget--compact]="!showTimeFrame()">
    @if (showTimeFrame()) {
    <mat-form-field class="widget-timeframe-select" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Time Frame</mat-label>
            <mat-select
            [value]="selectedTimeFrame()"
            (valueChange)="onTimeFrameChange($event)"
            >
            @for (tf of TIME_FRAMES; track tf) {
                <mat-option [value]="tf">{{ tf }}</mat-option>
            }
            </mat-select>
        </mat-form-field>
    }
    @if (loading()) {
        <app-loading-indicator label="Loading performance..." />
    } @else {
    @if (error() || (!instrumentSymbol() && accountsService.error())) {
        <p role="alert">{{ error() || accountsService.error() }}</p>
    }
    <ag-charts
        class="performance-chart"
        [class.performance-chart--compact]="!showTimeFrame()"
        [options]="options()"
    ></ag-charts>
    }
    @if (showTimeFrame()) {
        <p class="performance-timeframe">Time Frame: {{ selectedTimeFrame() }}</p>
    }
</div>
