<h2 mat-dialog-title>Create your first portfolio</h2>
<mat-dialog-content>
	<p>You need a portfolio before you can trade or track investments.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
	<button matButton type="button" (click)="dismiss()">Maybe later</button>
	<button matButton="filled" type="button" (click)="createPortfolio()">Create portfolio</button>
</mat-dialog-actions>
