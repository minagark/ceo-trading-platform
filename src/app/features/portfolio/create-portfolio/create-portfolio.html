<div class="create-portfolio">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Create a new Portfolio</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
                <mat-label>What type of portfolio would you like to create?</mat-label>
                <mat-radio-group formControlName="portfolioType">
                    <mat-radio-button value="BROKERAGE">Individual Brokerage</mat-radio-button>
                    <mat-radio-button value="RETIREMENT">Retirement</mat-radio-button>
                </mat-radio-group>
                <button matButton="filled" class="portfolio-create" type="submit">
                    Create Portfolio
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
