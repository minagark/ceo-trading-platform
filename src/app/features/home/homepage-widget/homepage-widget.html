<mat-card appearance="outlined" class="widget-container">
    <mat-card-header>
        <mat-card-title>{{ data().label }}</mat-card-title>
        @if (data().route) {
            <a [routerLink]="[data().route]" routerLinkActive="active" class="view-all">View All</a>
        } 
    </mat-card-header>
    <mat-card-content>
        <ng-container *ngComponentOutlet="data().content; inputs: data().inputs"></ng-container>
    </mat-card-content>
</mat-card>
